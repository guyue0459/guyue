name: Clean unused portfolio files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove verified unused files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv work-8.png images/work-8.png
          git rm profile.jpg style.css work-1.png work-2.png work-3.png work-4.png work-5.png project.config.json
          git rm .github/workflows/jekyll-gh-pages.yml .github/workflows/cleanup-repository.yml
          git commit -m "Clean unused portfolio files"
          git push
